<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <script src="js/profile-store.js"></script>
    <script src="game/story-data.js"></script>
    <script src="game/engine.js"></script>
    <script src="game/runtime.js"></script>
    <script>
        if (!window.TWSProfile.load()) {
            window.location.replace('player/player.html');
        } else if (!window.TWSProfile.isUnlocked()) {
            window.location.replace('lockscreen/lockscreen.html');
        }
    </script>
    <title>和校园里那个很受欢迎的男生谈恋爱</title>
</head>
<body class="home-page">
    <button class="powerBtn" type="button" aria-label="锁定手机" onclick="ukljuci()"></button>
    <div id="telefon">
        <div id="island"></div>
        <div id="ekran">
            <div id="realTime" class="real-time"></div>
            <div class="densa_strana" aria-hidden="true">
                <img src="img/signal.png" alt="">
                <img src="img/wi-fi.png" alt="">
                <img src="img/full-battery.png" alt="">
            </div>

            <a class="home-profile" href="player/player.html?edit=1" aria-label="修改玩家资料">
                <img data-player-avatar src="" alt="玩家头像">
                <span>
                    <small>当前玩家</small>
                    <strong data-player-name>玩家</strong>
                </span>
            </a>

            <div id="chapterBadge" class="chapter-badge">第一章</div>
            <button id="storyNotification" class="story-notification" type="button" hidden>
                <span id="notificationApp">KakaoTalk</span>
                <strong id="notificationTitle">新消息</strong>
                <small id="notificationBody"></small>
                <time id="notificationTime"></time>
            </button>

            <div class="home-apps" aria-label="应用">
                <button class="home-app" type="button" data-app="kakaotalk" data-url="kakaotalk/index.html" aria-label="打开 KakaoTalk">
                    <img src="img/kakaotalk-icon.svg" alt="">
                    <span>KakaoTalk</span>
                </button>
                <button class="home-app" type="button" data-app="forum" data-url="forum/index.html?v=2" aria-label="打开校园论坛"><i class="app-icon forum-icon">校</i><span>校园论坛</span></button>
                <button class="home-app" type="button" data-app="instagram" data-url="apps/index.html?app=instagram" aria-label="打开 Instagram"><i class="app-icon instagram-icon">◎</i><span>Instagram</span></button>
                <button class="home-app" type="button" data-app="x" data-url="apps/index.html?app=x" aria-label="打开 X"><i class="app-icon x-icon">𝕏</i><span>X</span></button>
                <button class="home-app" type="button" data-app="calendar" data-url="apps/index.html?app=calendar" aria-label="打开日历"><i class="app-icon calendar-icon"><b>10月</b>26</i><span>日历</span></button>
                <button class="home-app" type="button" data-app="photos" data-url="apps/index.html?app=photos" aria-label="打开相册"><i class="app-icon photos-icon">✿</i><span>相册</span></button>
                <button class="home-app" type="button" data-app="settings" data-url="apps/index.html?app=settings" aria-label="打开设置"><i class="app-icon settings-icon">⚙</i><span>设置</span></button>
            </div>

            <div id="donjeIkonice">
                <a href="poruke/poruke.html" aria-label="信息"><img src="img/iphone-message-computer-icons-text-messaging-messenger-93c1965b946804798a4d72bab8ef4b2f.png" alt="" class="donjaIkonica"></a>
                <a href="poziv/poziv.html" aria-label="电话"><img src="img/dial icon.png" alt="" class="donjaIkonica" id="poziv"></a>
                <a href="kalkulator/kalkulator.html" aria-label="计算器"><img src="img/calc.png" alt="" class="donjaIkonica"></a>
            </div>

            <section id="phoneApp" class="phone-app" aria-hidden="true" hidden>
                <iframe id="phoneAppFrame" title="手机应用"></iframe>
                <button id="closePhoneApp" class="app-home-indicator" type="button" aria-label="返回手机桌面"></button>
            </section>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
