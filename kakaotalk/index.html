<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff"><link rel="stylesheet" href="kakaotalk.css"><link rel="stylesheet" href="story.css"><title>KakaoTalk</title></head>
<body>
<svg class="svg-defs" aria-hidden="true"><defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.8"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="7.2" r="4" fill="currentColor" stroke="none"/><path d="M4.7 21c.3-5 2.8-7.7 7.3-7.7s7 2.7 7.3 7.7" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M3.2 4.5h17.6v13H10l-5.2 3.3.8-3.3H3.2Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7.1 3.3 4.2 5c-.9.5-.8 2.5.2 4.8 1.3 3 4 5.8 6.9 7.7 2.5 1.7 5.1 2.5 6.1 1.5l2-2.7-4.4-3-1.8 2c-2.1-1-4.5-3.3-5.3-5.5l2.2-1.6Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15.5 4-8 8 8 8"/></symbol><symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="2" fill="currentColor" stroke="none"/></symbol>
</defs></svg>
<div id="kakaoApp" class="kakao-app">
    <header class="status-bar"><strong id="kakaoTime">08:12</strong><span class="silent">◆</span><span class="status-spacer"></span><span class="signal"><i></i><i></i><i></i><i></i></span><b>5G</b><span class="battery"><span>88</span></span></header>

    <section class="page" data-page="friends">
        <header class="page-header"><h1>好友</h1><div class="header-actions"><button aria-label="搜索"><svg><use href="#i-search"/></svg></button><button aria-label="设置"><svg><use href="#i-settings"/></svg></button></div></header>
        <main id="friendsList" class="scroll-area friends-content"></main>
    </section>

    <section class="page is-active" data-page="chats">
        <header class="page-header"><h1>聊天</h1><div class="header-actions"><button aria-label="搜索"><svg><use href="#i-search"/></svg></button><button aria-label="设置"><svg><use href="#i-settings"/></svg></button></div></header>
        <div class="filters"><button class="selected">全部</button><button>未读</button><button>小组</button></div>
        <main id="threadList" class="scroll-area list-content"></main>
    </section>

    <section class="page" data-page="calls">
        <header class="page-header"><h1>通话</h1><div class="header-actions"><button aria-label="搜索"><svg><use href="#i-search"/></svg></button><button aria-label="设置"><svg><use href="#i-settings"/></svg></button></div></header>
        <main id="callList" class="scroll-area list-content"></main>
    </section>

    <section class="page" data-page="more">
        <header class="page-header"><h1>更多</h1><div class="header-actions"><button aria-label="设置"><svg><use href="#i-settings"/></svg></button></div></header>
        <main class="scroll-area more-content"><a class="more-profile" href="../player/player.html?edit=1" target="_top"><img data-player-avatar src="" alt="玩家头像"><span><strong data-player-name>玩家</strong><small>修改玩家姓名</small></span></a><div class="story-save-card"><span>当前章节</span><strong id="chapterLabel">第一章</strong><small id="storyDate">2026年10月26日</small></div><div class="service-grid"><button><span>⌖</span><small>地图</small></button><button><span>▱</span><small>打车</small></button><button><span>✉</span><small>邮箱</small></button><button><span>▣</span><small>日历</small></button><button><span>☁</span><small>云盘</small></button><button><span>☺</span><small>表情</small></button><button><span>▥</span><small>主题</small></button><button><span>ⓚ</span><small>账号</small></button></div></main>
    </section>

    <section class="page detail-page" data-page="chat">
        <header class="story-chat-header"><button id="backToChats" class="round-btn" aria-label="返回聊天列表"><svg><use href="#i-back"/></svg></button><div><h1 id="chatTitle">聊天</h1><small id="chatSubtitle"></small></div><button class="round-btn" aria-label="菜单"><svg><use href="#i-more"/></svg></button></header>
        <main id="conversation" class="conversation" aria-live="polite"></main>
        <section id="choiceTray" class="choice-tray" aria-label="预设回复"></section>
    </section>

    <nav id="bottomNav" class="bottom-nav"><button data-tab="friends" aria-label="好友"><svg><use href="#i-person"/></svg></button><button class="active" data-tab="chats" aria-label="聊天"><svg><use href="#i-chat"/></svg></button><button data-tab="calls" aria-label="通话"><svg><use href="#i-phone"/></svg></button><button data-tab="more" aria-label="更多"><svg><use href="#i-more"/></svg></button></nav>

    <div id="chapterOverlay" class="chapter-overlay" hidden><div><p id="chapterEndLabel">第一章结束</p><button id="nextChapterButton">进入第二章</button></div></div>
</div>
<script src="../js/profile-store.js"></script><script src="../game/story-data.js"></script><script src="../game/engine.js"></script><script src="../game/runtime.js"></script><script src="kakaotalk.js"></script>
</body></html>
