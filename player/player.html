<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101010">
    <link rel="stylesheet" href="player.css">
    <title>和校园里那个很受欢迎的男生谈恋爱</title>
</head>
<body>
    <main class="phone">
        <form id="profileForm" novalidate>
            <label class="sr-only" for="playerName">玩家姓名</label>
            <input id="playerName" type="text" maxlength="20" autocomplete="nickname" placeholder="请输入你的名字" aria-label="玩家姓名" required>
            <button id="continueButton" type="submit">进入游戏</button>
            <p id="formMessage" role="alert" aria-live="polite"></p>
        </form>
    </main>
    <script src="../js/profile-store.js"></script>
    <script src="../game/story-data.js"></script>
    <script src="../game/engine.js"></script>
    <script src="../game/runtime.js"></script>
    <script src="player.js"></script>
</body>
</html>
